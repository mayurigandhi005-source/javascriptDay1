<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
  </head>
  <body>
    <script>
        let variable1 = 3;
        console.log(variable1);

        let calculation = 2 + 2;
        console.log(calculation);
        console.log(calculation + 2);

        let result = calculation + 2;
        console.log(result);

        let message ='hello';
        console.log(message); console.log(';') // JS insert last semicolon automatically

        variable1 = 5;          // Don't use "let" when re-assiging
        console.log(variable1);
        
        variable1 = variable1 + 1;  // Increase value of the
        console.log(variable1);

        console.log(typeof variable1);
    </script>
  </body> 
    
</html>
